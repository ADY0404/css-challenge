{% extends "homepage/base.html" %}
{% load static %}
{% block content %}
<main class="container my-5 d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="card border-0 shadow-sm p-4 p-md-5 text-center" style="width: 100%; max-width: 480px; border-radius: 16px; background-color: #FFFFFF;">
        <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-primary-subtle text-primary mx-auto mb-3" style="width: 64px; height: 64px;">
            <i class="bi bi-envelope-check fs-2"></i>
        </div>
        <h2 class="fw-bold mb-2" style="font-size: 1.5rem;">Check Your Email</h2>
        <p class="text-secondary small mb-4">
            If an account is associated with the email address you entered, instructions for resetting your password have been sent.
        </p>
        <div class="d-grid gap-2">
            <a class="btn btn-primary py-2 fw-semibold" href="{% url 'login' %}">Return to Sign In</a>
        </div>
    </div>
</main>
{% endblock %}
