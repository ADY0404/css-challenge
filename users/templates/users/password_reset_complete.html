{% extends "homepage/base.html" %}
{% block content %}
<main class="container my-5 d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="card border-0 shadow-sm p-4 p-md-5 text-center" style="width: 100%; max-width: 480px; border-radius: 16px; background-color: #FFFFFF;">
        <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-success-subtle text-success mx-auto mb-3" style="width: 64px; height: 64px;">
            <i class="bi bi-shield-lock-fill fs-2"></i>
        </div>
        <h2 class="fw-bold mb-2" style="font-size: 1.5rem;">Password Updated</h2>
        <p class="text-secondary small mb-3">Your password has been successfully reset.</p>
        <div class="alert alert-warning text-start small py-2 px-3 mb-4">
            <i class="bi bi-hourglass-split me-1"></i><strong>Security Notice:</strong> Your account will open in <strong>10 minutes</strong>. Please wait before attempting to sign in.
        </div>
        <div class="d-grid gap-2">
            <a class="btn btn-primary py-2 fw-semibold" href="{% url 'login' %}">Return to Sign In</a>
        </div>
    </div>
</main>
{% endblock %}
