{% extends "homepage/base.html" %}
{% load static %}
{% block content %}
<div class="d-flex justify-content-center align-items-center py-5 bg-light" style="min-height: 80vh;">
    <div class="card border-0 shadow-sm p-4 p-md-5" style="width: 100%; max-width: 420px; border-radius: 16px; background-color: #FFFFFF;">
        <!-- Logo & Title -->
        <div class="text-center mb-4">
            <img src="{% static 'images/com.png' %}" alt="CSS Logo" class="img-fluid rounded mb-2" style="max-height: 56px;">
            <h2 class="fw-bold text-dark mb-1" style="font-size: 1.5rem;">Sign In</h2>
            <p class="text-secondary small mb-0">Access challenges, community channels, and your profile</p>
        </div>

        <!-- Login Form -->
        <form method="POST" novalidate>
            {% csrf_token %}
            <div class="mb-3">
                <label for="usernameInput" class="form-label small fw-bold text-secondary">Username or Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-person"></i></span>
                    <input type="text" id="usernameInput" name="username" class="form-control border-start-0" placeholder="Enter username or email" required autofocus>
                </div>
            </div>

            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center">
                    <label for="passwordInput" class="form-label small fw-bold text-secondary mb-0">Password</label>
                    <a href="{% url 'password_reset' %}" class="text-decoration-none small text-primary">Forgot Password?</a>
                </div>
                <div class="input-group mt-1">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                    <input type="password" id="passwordInput" name="password" class="form-control border-start-0 border-end-0" placeholder="Enter your password" required>
                    <button type="button" class="btn btn-outline-secondary border-start-0 bg-white" id="togglePasswordBtn" aria-label="Toggle password visibility">
                        <i class="bi bi-eye text-muted" id="togglePasswordIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mt-2">Sign In</button>
        </form>

        <!-- Footer Link -->
        <div class="text-center mt-4 pt-3 border-top">
            <p class="text-muted small mb-0">
                Don't have a student account? <a href="{% url 'signup' %}" class="text-decoration-none fw-semibold text-primary">Sign up here</a>.
            </p>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const toggleBtn = document.getElementById('togglePasswordBtn');
        const passInput = document.getElementById('passwordInput');
        const icon = document.getElementById('togglePasswordIcon');
        if (toggleBtn && passInput) {
            toggleBtn.addEventListener('click', function() {
                if (passInput.type === 'password') {
                    passInput.type = 'text';
                    icon.classList.remove('bi-eye');
                    icon.classList.add('bi-eye-slash');
                } else {
                    passInput.type = 'password';
                    icon.classList.remove('bi-eye-slash');
                    icon.classList.add('bi-eye');
                }
            });
        }
    });
</script>
{% endblock content %}
