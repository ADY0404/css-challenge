{% extends "homepage/base.html" %}
{% load static %}
{% block content %}
{% if RECAPTCHA_ENABLED %}
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
{% endif %}
<main class="container my-5 d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="card border-0 shadow-sm p-4 p-md-5" style="width: 100%; max-width: 460px; border-radius: 16px; background-color: #FFFFFF;">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-primary-subtle text-primary mx-auto mb-3" style="width: 64px; height: 64px;">
                <i class="bi bi-key fs-2"></i>
            </div>
            <h2 class="fw-bold mb-1" style="font-size: 1.5rem;">Reset Password</h2>
            <p class="text-secondary small mb-0">Enter your student email address to receive recovery instructions.</p>
        </div>

        <form method="post" novalidate>
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_email" class="form-label small fw-bold text-secondary">Account Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                    <input type="email" id="id_email" name="email" class="form-control border-start-0" placeholder="student@example.edu" required autofocus>
                </div>
            </div>
            <!-- {% if RECAPTCHA_ENABLED and RECAPTCHA_SITE_KEY %}
            <div class="mb-3 d-flex justify-content-center">
                <div class="g-recaptcha" data-sitekey="{{ RECAPTCHA_SITE_KEY }}"></div>
            </div>
            {% endif %} -->
            <button class="btn btn-primary w-100 py-2 fw-semibold mt-2" type="submit">Send Reset Link</button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
            <a href="{% url 'login' %}" class="text-decoration-none small text-muted">
                <i class="bi bi-arrow-left me-1"></i>Back to Sign In
            </a>
        </div>
    </div>
</main>
{% endblock %}
