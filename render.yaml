services:
  - type: web
    name: css-society
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn myfirst.wsgi:application --timeout 120 --workers 2"
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: css-society-db
          property: connectionString
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_TIMEOUT
        value: "10"
databases:
  - name: css-society-db
    databaseName: css_society
    user: css_society
    plan: free
