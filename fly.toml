# fly.toml app configuration file for Computer Science Society Platform
# See https://fly.io/docs/reference/configuration/ for details.

app = "css-society"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"


[env]
  PORT = "8000"
  SECURE_SSL_REDIRECT = "true"
  SQLITE_DB_PATH = "/data/db.sqlite3"
  MEDIA_ROOT = "/data/media"

[mounts]
  source = "data_vol"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

